<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Sistema Gestión UTEQ</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
    }
    .card {
      background: #ffffff; padding: 2.2rem; border-radius: 12px; width: 100%; max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0 0 0.4rem; font-size: 1.5rem; color: #0f172a; text-align: center; }
    p.sub { margin: 0 0 1.5rem; font-size: 0.9rem; color: #64748b; text-align: center; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; }
    input {
      width: 100%; padding: 0.65rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: #2563eb; }
    button {
      width: 100%; padding: 0.75rem; background: #2563eb; color: #fff; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem;
    }
    button:hover { background: #1d4ed8; }
    .error-msg {
      display: none; background: #fee2e2; color: #b91c1c; padding: 0.65rem;
      border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sistema de Gestión</h1>
    <p class="sub">Proyecto Parcial 2 • CI/CD &amp; Observabilidad</p>

    <div id="login-error" data-testid="login-error" class="error-msg"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" data-testid="login-email" placeholder="admin@uteq.edu.mx" required />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" data-testid="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" id="btn-login" data-testid="login-submit">Ingresar</button>
    </form>
  </div>

  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('login-error');
      errorBox.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.error || 'Error al iniciar sesión';
          errorBox.style.display = 'block';
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorBox.textContent = 'Error de conexión con el servidor';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
